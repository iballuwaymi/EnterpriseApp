name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate iOS project files
        run: flutter create --platforms=ios --org com.almuhaidib .

      - name: Add required permissions to Info.plist
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'التطبيق يحتاج الكاميرا لفحص الباركود'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'التطبيق يحتاج الموقع لتسجيل الحضور والانصراف'" $PLIST
          /usr/libexec/PlistBuddy -c
